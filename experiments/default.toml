# Main evaluation: rule-based ABRs and a fixed-bitrate baseline under different networks.
# Run from the repository root:  streamwise-experiment run experiments/default.toml
video = "bbb"
abrs = ["throughput", "buffer", "fixed:2"]   # fixed:2 = always 720p (2500k)
repeats = 1
max_buffer_s = 30.0
startup_buffer_s = 5.0
base_port = 9200

[[scenario]]
name = "const_1mbps"
rate_mbps = 1.0

[[scenario]]
name = "const_2mbps"
rate_mbps = 2.0

[[scenario]]
name = "const_4mbps"
rate_mbps = 4.0

[[scenario]]
name = "const_8mbps"
rate_mbps = 8.0

[[scenario]]
name = "drop"
trace = "traces/drop.txt"

[[scenario]]
name = "fluctuating"
trace = "traces/fluctuating.txt"
