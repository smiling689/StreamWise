[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwise"
version = "0.1.0"
description = "TCP-based segmented video streaming with adaptive bitrate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
streamwise-server = "streamwise.server.__main__:main"
streamwise-client = "streamwise.client.__main__:main"
streamwise-media = "streamwise.media.__main__:main"

[project.optional-dependencies]
analysis = ["numpy", "pandas", "matplotlib"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
